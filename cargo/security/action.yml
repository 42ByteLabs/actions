name: "Cargo - Security"
description: "Security auditing for Rust/Cargo projects using cargo-audit and cargo-deny"
author: "42ByteLabs"

inputs:
  cargo:
    description: "Path to Cargo.toml"
    required: false
    default: "./Cargo.toml"
  cargo-audit:
    description: "Run cargo-audit to check for known vulnerabilities"
    required: false
    default: "true"
  cargo-deny:
    description: "Run cargo-deny to check dependencies, licenses, and security advisories"
    required: false
    default: "true"
  rust-toolchain:
    description: "Rust toolchain to use (stable, beta, nightly)"
    required: false
    default: "stable"

runs:
  using: "composite"
  steps:
    - name: "Setup - Rust Toolchain"
      shell: bash
      env:
        RUSTUP_SHA256: 7d0ea0f8eba7fa1ebfe998091cd7ec4501e33ec5ca6b884eb4d894d7da5170af
        RUSTUP_URL: https://sh.rustup.rs
        RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
      run: |
        ${{ github.action_path }}/../setup/setup.sh

    - name: "Install cargo-audit"
      if: inputs.cargo-audit == 'true'
      shell: bash
      run: |
        cargo install cargo-audit --locked

    - name: "Run cargo-audit"
      if: inputs.cargo-audit == 'true'
      shell: bash
      working-directory: ${{ inputs.cargo != './Cargo.toml' && github.workspace || '.' }}
      env:
        CARGO_LOCATION: ${{ inputs.cargo }}
      run: |
        echo "Running cargo-audit..."
        cargo_lock="$(dirname "$CARGO_LOCATION")/Cargo.lock"
        if [ ! -f "$cargo_lock" ]; then
          echo "Cargo.lock not found at $cargo_lock; generating lockfile..."
          cargo generate-lockfile --manifest-path "$CARGO_LOCATION"
        fi
        cargo audit --file "$cargo_lock"

    - name: "Run cargo-deny"
      if: inputs.cargo-deny == 'true'
      uses: EmbarkStudios/cargo-deny-action@a531616d8ce3b9177443e48a1159bc945a099823 # v2.0.19
      with:
        manifest-path: ${{ inputs.cargo }}

branding:
  icon: "shield"
  color: "orange"
