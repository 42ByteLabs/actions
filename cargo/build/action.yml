name: "Cargo - Build"
description: "Build and test Rust/Cargo projects with formatting, linting, and clippy checks"
author: "42ByteLabs"

inputs:
  crate:
    description: "Crate name"
    required: false
  features:
    description: "Crate features to enable"
    required: false
    default: ""
  cargo:
    description: "Path to Cargo.toml"
    required: false
    default: "./Cargo.toml"
  rust-toolchain:
    description: "Rust toolchain to use (stable, beta, nightly)"
    required: false
    default: "stable"
  cache:
    description: "Use GitHub Actions Cache"
    required: false
    default: "true"
  format:
    description: "Run Cargo fmt on the project"
    required: false
    default: "true"
  clippy:
    description: "Run Clippy checks on project"
    required: false
    default: "true"
  tests:
    description: "Run Cargo tests on project"
    required: false
    default: "true"
  docs:
    description: "Build Cargo documentation"
    required: false
    default: "true"
  security:
    description: "Run Cargo security tooling (cargo-audit and cargo-deny)"
    required: false
    default: "true"
  examples:
    description: "Run Cargo examples on project"
    required: false
    default: "false"

outputs:
  name:
    description: "Project/package name"
    value: ${{ steps.project.outputs.name }}
  version:
    description: "Project/package version"
    value: ${{ steps.project.outputs.version }}
  rust-version:
    description: "Minimum Rust version (MSRV)"
    value: ${{ steps.project.outputs.rust-version }}
  workspace:
    description: "Whether this is a workspace (true/false)"
    value: ${{ steps.project.outputs.workspace }}
  workspace-members:
    description: "Comma-separated list of workspace member names"
    value: ${{ steps.project.outputs.workspace-members }}

runs:
  using: "composite"
  steps:
    - name: "Load project"
      id: project
      uses: 42ByteLabs/actions/cargo/project@67202e2bde25751421efc76da3457b067f90143a # internal
      with:
        cargo: ${{ inputs.cargo }}

    - name: "Setup - Rust Toolchain"
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: clippy,rustfmt
        toolchain: ${{ inputs.rust-toolchain }}

    - name: "Restore cached Cargo"
      id: cache-restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ inputs.rust-toolchain }}-cargo

    - name: "Cargo fmt"
      if: inputs.format == 'true'
      shell: bash
      env:
        CARGO_LOCATION: ${{ inputs.cargo }}
      run: cargo fmt --check --manifest-path "$CARGO_LOCATION"

    - name: "Cargo Build"
      shell: bash
      env:
        CARGO_FEATURES: ${{ inputs.features }}
        CARGO_LOCATION: ${{ inputs.cargo }}
        PROJECT_CRATE: ${{ inputs.crate || steps.project.outputs.name }}
        PROJECT_WORKSPACE: ${{ steps.project.outputs.workspace }}
      run: |
        ${{ github.action_path }}/build.sh

    - name: "Run Tests"
      if: inputs.tests == 'true'
      shell: bash
      env:
        CARGO_FEATURES: ${{ inputs.features }}
        CARGO_LOCATION: ${{ inputs.cargo }}
        PROJECT_CRATE: ${{ inputs.crate || steps.project.outputs.name }}
        PROJECT_WORKSPACE: ${{ steps.project.outputs.workspace }}
      run: |
        ${{ github.action_path }}/test.sh

    - name: "Build Docs"
      if: inputs.docs == 'true'
      shell: bash
      env:
        CARGO_FEATURES: ${{ inputs.features }}
        CARGO_LOCATION: ${{ inputs.cargo }}
        PROJECT_CRATE: ${{ inputs.crate || steps.project.outputs.name }}
        PROJECT_WORKSPACE: ${{ steps.project.outputs.workspace }}
      run: |
        ${{ github.action_path }}/docs.sh

    - name: "Run Examples"
      if: inputs.examples == 'true' && steps.project.outputs.examples != ''
      shell: bash
      env:
        CARGO_LOCATION: ${{ inputs.cargo }}
      run: |
        ${{ github.action_path }}/../examples/examples.sh

    - name: "Running Clippy"
      if: inputs.clippy == 'true' && inputs.rust-toolchain == 'stable'
      shell: bash
      continue-on-error: true
      env:
        CARGO_FEATURES: ${{ inputs.features }}
        CARGO_LOCATION: ${{ inputs.cargo }}
        PROJECT_CRATE: ${{ inputs.crate || steps.project.outputs.name }}
        PROJECT_WORKSPACE: ${{ steps.project.outputs.workspace }}
      run: |
        ${{ github.action_path }}/clippy.sh

    - name: "Upload Clippy SARIF (stable only)"
      if: inputs.clippy == 'true' && inputs.rust-toolchain == 'stable' && hashFiles('rust-clippy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      with:
        sarif_file: rust-clippy-results.sarif
        wait-for-processing: true

    - name: "Run Security Audit"
      if: inputs.security == 'true'
      uses: 42ByteLabs/actions/cargo/security@67202e2bde25751421efc76da3457b067f90143a # internal
      with:
        cargo: ${{ inputs.cargo }}
        rust-toolchain: ${{ inputs.rust-toolchain }}

    - name: "Save Cargo / Rust Cache"
      id: cache-save
      # Only save the cache on push events.
      if: inputs.cache == 'true' && github.event_name == 'push'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

branding:
  icon: "package"
  color: "orange"
