name: "Cargo - Build"
description: "Build and test Rust/Cargo projects with formatting, linting, and clippy checks"
author: "42ByteLabs"

inputs:
  package:
    description: "Cargo Package"
    required: false
  features:
    description: "Crate Features"
    required: false
  version:
    description: "Rust version to use (stable, beta, nightly)"
    required: false
    default: "stable"
  cache:
    description: "Use GitHub Actions Cache"
    required: false
    default: "true"
  format:
    description: "Run Cargo fmt on the project"
    required: false
    default: "true"
  clippy:
    description: "Run Clippy checks on project"
    required: false
    default: "true"
  tests:
    description: "Run Cargo tests on project"
    required: false
    default: "true"
  security:
    description: "Run Cargo security tooling"
    required: false
    default: "true"
  examples:
    description: "Run Cargo examples on project"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Setup - Rust Toolchain"
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy,rustfmt
        toolchain: ${{ inputs.version }}

    - name: "Restore cached Cargo"
      id: cache-restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ inputs.rust-version }}-cargo

    - name: "Cargo fmt"
      if: inputs.format == 'true'
      shell: bash
      run: cargo fmt --check

    - name: "Cargo Build"
      shell: bash
      env:
        CARGO_FEATURES: ${{ inputs.features }}
      run: |
        set -e
        if [ -n "$CARGO_FEATURES" ]; then
            echo "📦 Standard build with features: '${CARGO_FEATURES}'"
            cargo build --workspace --features "${CARGO_FEATURES}"
        else
            echo "📦 Standard build (default)"
            cargo build --workspace
        fi

        echo "📦 Disable all features"
        cargo build --no-default-features

    - name: "Run Tests"
      if: inputs.tests == 'true'
      shell: bash
      env:
        CARGO_FEATURES: ${{ inputs.features }}
      run: |
        set -e
        if [ -n "$CARGO_FEATURES" ]; then
          cargo test --workspace --features "${CARGO_FEATURES}"
          cargo test --workspace --examples --features "${CARGO_FEATURES}"
          cargo test --workspace --bins --features "${CARGO_FEATURES}"
        else
          cargo test --workspace
          cargo test --workspace --examples
          cargo test --workspace --bins
        fi

    - name: "Running Examples"
      if: inputs.examples == 'true'
      shell: bash
      env:
        CARGO_LOCATION: ${{ inputs.cargo }}
      run: |
        ${{ github.action_path }}/../scripts/examples.sh

    - name: "Running Clippy"
      if: inputs.clippy == 'true' && inputs.version == 'stable'
      shell: bash
      continue-on-error: true
      run: |
        set -e
        if ! command -v clippy-sarif &> /dev/null; then
          cargo install clippy-sarif sarif-fmt
        fi

        cargo clippy \
          --all-features --all-targets \
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt

    - name: "Upload Clippy SARIF (stable only)"
      if: matrix.rust-version == 'stable'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: rust-clippy-results.sarif
        wait-for-processing: true

    - name: "Save Cargo / Rust Cache"
      id: cache-save
      # Only save the cache on `main`
      if: inputs.cache == 'true' && github.event_name == 'push'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

branding:
  icon: "package"
  color: "orange"
